apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: dev
          # - environment: staging
          # - environment: production
  template:
    metadata:
      name: 'cert-manager-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.15.3
          helm:
            releaseName: cert-manager
            valueFiles:
              - $values/infrastructure/cert-manager/values/common.yaml
              - $values/infrastructure/cert-manager/values/{{.environment}}.yaml
        - repoURL: https://github.com/NicolasViaud/cluster-gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/NicolasViaud/cluster-gitops.git
          targetRevision: main
          path: 'infrastructure/cert-manager/overlays/{{.environment}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
