apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: dev
          # - environment: staging
          # - environment: production
  template:
    metadata:
      name: 'metrics-server-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://kubernetes-sigs.github.io/metrics-server/
          chart: metrics-server
          targetRevision: 3.12.1
          helm:
            releaseName: metrics-server
            valueFiles:
              - $values/infrastructure/metrics-server/values/common.yaml
              - $values/infrastructure/metrics-server/values/{{.environment}}.yaml
        - repoURL: https://github.com/NicolasViaud/cluster-gitops.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/NicolasViaud/cluster-gitops.git
          targetRevision: main
          path: 'infrastructure/metrics-server/overlays/{{.environment}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: metrics-server
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
