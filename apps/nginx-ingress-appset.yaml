apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-ingress
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: dev
          # - environment: staging
          # - environment: production
  template:
    metadata:
      name: 'nginx-ingress-{{.environment}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://kubernetes.github.io/ingress-nginx
          chart: ingress-nginx
          targetRevision: 4.11.3
          helm:
            releaseName: ingress-nginx
            values: |
              controller:
                service:
                  type: LoadBalancer
                metrics:
                  enabled: true
                  serviceMonitor:
                    enabled: false
                {{- if eq .environment "dev"}}
                replicaCount: 1
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                {{- else}}
                replicaCount: 2
                {{- end}}
        - repoURL: https://github.com/NicolasViaud/cluster-gitops.git
          targetRevision: main
          path: 'infrastructure/nginx-ingress/overlays/{{.environment}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
