apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - ../../base

commonLabels:
  environment: staging

helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.14.5
    releaseName: external-dns
    namespace: external-dns
    valuesInline:
      sources:
        - service
        - ingress
      policy: sync
      registry: txt
      txtOwnerId: external-dns-staging
      domainFilters: []
      logLevel: info
