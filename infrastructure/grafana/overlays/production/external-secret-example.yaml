# Production environment - ExternalSecret example
# To use ExternalSecrets:
# 1. Install external-secrets operator: https://external-secrets.io
# 2. Configure a SecretStore (e.g., AWS Secrets Manager, Vault, etc.)
# 3. Create an ExternalSecret that references your external secret store
#
# Example using AWS Secrets Manager:
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager  # Reference to your SecretStore
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: production/grafana/admin  # Path in AWS Secrets Manager
        property: username
    - secretKey: admin-password
      remoteRef:
        key: production/grafana/admin
        property: password
