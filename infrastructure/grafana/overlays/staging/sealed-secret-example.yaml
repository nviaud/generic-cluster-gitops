# Staging environment - SealedSecret example
# To create a SealedSecret:
# 1. Install sealed-secrets controller: https://github.com/bitnami-labs/sealed-secrets
# 2. Create a regular secret file (never commit it!)
# 3. Encrypt it using kubeseal:
#    kubectl create secret generic grafana-admin-credentials \
#      --from-literal=admin-user=admin \
#      --from-literal=admin-password=YOUR_SECURE_PASSWORD \
#      --dry-run=client -o yaml | \
#    kubeseal -o yaml > sealed-secret-grafana.yaml
#
# Example SealedSecret (with dummy encrypted data):
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  encryptedData:
    admin-user: AgBx... # This would be the actual encrypted data
    admin-password: AgBy... # This would be the actual encrypted data
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: monitoring
    type: Opaque
